# Development purpose only.
# When UIPC_BUILD_PYBIND is ON, the libuipc/python will be copied to CMAKE Build Directory.
# After pyuipc is built, this pyproject.toml will help create a wheel package for testing.
# NOTE: this pyproject.toml won't trigger any cmake build process.

[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuipc"
version = "0.9.0"
requires-python = ">=3.10, <3.15"

dependencies = [
    "numpy",
    "matplotlib",
    "polyscope>=2.5.0, <3.0.0",
    "huggingface_hub",
]

authors = [
    { name = "Zihang Zhu", email = "paradise_craftsman@hotmail.com" },
    { name = "MuGdxy", email = "lxy819469559@gmail.com" },
]

maintainers = [{ name = "MuGdxy", email = "lxy819469559@gmail.com" }]

readme = "README.md"
license = { file = "LICENSE" }
description = "A Cross-Platform Modern C++20 Library of Unified Incremental Potential Contact (prebuilt wheels require CUDA 12.8)"

keywords = [
    "ipc",
    "computer graphics",
    "physics simulation",
    "cuda",
    "fem",
    "contact",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://spirimirror.github.io/libuipc-doc/"
Issues = "https://github.com/spiriMirror/libuipc/issues"

[project.scripts]
uipc = "uipc.__main__:main"

[project.optional-dependencies]
gui = ["polyscope"]
dev = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.dll", "*.so*", "*.dylib", "*.pyd", "*.pyi", "*.json"]

[tool.pytest.ini_options]
addopts = ["-s", "-m", "not example and not cuda"]
markers = [
    "basic: mark a test as basic",
    "cuda: mark a test as requiring an NVIDIA GPU and CUDA backend",
    "gui: mark a test as requiring GUI",
    "typing: mark a test as requiring type checking",
    "example: mark a test as an example",
]

name: Manual Hotfix Publish
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the failed Build Python Wheels release'
        required: true

jobs:
  retry-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retry failed jobs in the original release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '
            select(.path == ".github/workflows/python-wheels.yml" and
                   .event == "release" and .status == "completed") | .conclusion')
          case "$conclusion" in
            failure)   gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY" ;;
            cancelled) gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" ;;
            *) echo "Expected a failed or cancelled wheel release run." >&2; exit 1 ;;
          esac

name: clang-format

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/*.inl"
      - "**/*.cu"
      - "**/*.cuh"
      - ".clang-format"
      - ".github/workflows/clang-format.yml"

jobs:
  check:
    runs-on: ubuntu-22.04

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-clang-format
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup clang-format 18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check changed C++ files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.h' '*.hpp' '*.cpp' '*.inl' '*.cu' '*.cuh')
          if [ -z "$FILES" ]; then
            echo "No C++ files changed."
            exit 0
          fi
          echo "Checking files:"
          echo "$FILES"
          echo "$FILES" | xargs clang-format-18 --dry-run --Werror

name: xmake

on:
  push:
    branches:
      - 'main'
      - 'refactor-main'
    paths-ignore:
      - '.clang-format'
      - '.clangd'
      - '.cursor/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/cmake.yml'
      - '**/CMakeLists.txt'
      - '.github/workflows/docs.yml'
      - CMakePresets.json
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '.clang-format'
      - '.clangd'
      - '.cursor/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/cmake.yml'
      - '**/CMakeLists.txt'
      - '.github/workflows/docs.yml'
      - CMakePresets.json
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-xmake-${{ matrix.os }}
        cancel-in-progress: true

    steps:
      - name: Maximize build space
        if: matrix.os == 'ubuntu-24.04'
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup cuda
        if: matrix.os == 'ubuntu-24.04'
        uses: Jimver/cuda-toolkit@b6fc3a9f3f15256d9d94ffe1254f9c5a2565cde6 # v0.2.30
        id: cuda-toolkit
        with:
          cuda: '12.8.1'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: 3.0.5
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.os }}

      - name: Xmake configure
        if: matrix.os == 'ubuntu-24.04'
        run: |
          xmake config --yes --github_actions=y

      - name: Xmake configure
        if: matrix.os == 'windows-2022'
        run: |
          xrepo env -y -v -b cuda "xmake config --yes --github_actions=y"

      - name: Build libuipc
        run: |
          xmake build uipc_geometry
          xmake build --jobs=3 cuda
          xmake build --all

      - name: Run CPU test suite
        run: |
          xmake run common
          xmake run core
          xmake run geometry

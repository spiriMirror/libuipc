name: Repository Contracts

on:
  push:
    branches:
      - "main"
      - "refactor-main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-repository-contracts
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Check repository contracts
        run: |
          python scripts/detect_0kb_files.py --check
          python scripts/check_constitution_api.py
          python scripts/check_workflow_pins.py
          python -m unittest discover -s scripts/tests -p 'test_repository_contracts.py'
